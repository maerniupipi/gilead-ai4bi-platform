[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4bi-excel-agent-batch"
version = "0.2.0"
description = "Authenticated XLSX batch runner with durable database history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.2,<1",
    "httpx>=0.28.1,<0.29",
    "openpyxl>=3.1.5,<4",
    "uvicorn>=0.29,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
excel-agent-batch = "app.main:main"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]
