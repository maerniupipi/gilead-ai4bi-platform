name: ai4bi-batch-runner
services:
  batch-runner:
    image: ${BATCH_IMAGE:-ai4bi/excel-batch-runner:local}
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "${BATCH_PORT:-8866}:8866"
    env_file:
      - .env
    environment:
      BATCH_DATA_DIR: /data
      BATCH_ALLOW_LOCAL_PATHS: "false"
    volumes:
      - batch-data:/data
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
volumes:
  batch-data:
